[package]
name = "fouine-app"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Fouine : recherche instantanee de fichiers (interface egui/eframe + wgpu)"

[[bin]]
name = "fouine"
path = "src/main.rs"

[dependencies]
fouine-core = { path = "../fouine-core" }
eframe = { version = "0.37", default-features = false, features = ["wgpu", "default_fonts", "wayland", "x11"] }
egui_extras = { version = "0.37", default-features = false }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[target.'cfg(windows)'.dependencies]
tray-icon = { version = "0.26.1", default-features = false }
windows-service = "0.8.1"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_UI_Input_KeyboardAndMouse"] }

[build-dependencies]
winresource = "0.1"
